name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # اگر فقط فایل MyVPN.zip را آپلود کرده‌اید خودکار باز می‌شود؛ وگرنه پروژه همین ریشه است
      - name: Locate project
        run: |
          Z="$(ls -1 ./*.zip 2>/dev/null | head -1)"
          if [ -n "$Z" ]; then
            echo "Found zip: $Z"
            unzip -q "$Z" -d work
            S="$(find "$PWD/work" -name settings.gradle.kts | head -1)"
          else
            S="$(find "$PWD" -maxdepth 2 -name settings.gradle.kts | head -1)"
          fi
          if [ -z "$S" ]; then
            echo "::error::پروژه پیدا نشد. فایل zip پروژه (MyVPN.zip) باید در ریشهٔ مخزن آپلود شود."
            echo "--- فایل‌های مخزن ---"; ls -la; exit 1
          fi
          P="$(dirname "$S")"
          echo "PROJECT=$P" >> "$GITHUB_ENV"
          echo "Project dir: $P"; ls -la "$P"; ls -la "$P/app" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # هسته را یک‌بار می‌سازیم و کش می‌کنیم تا اجرای دوباره ۷ دقیقه سریع‌تر شود
      - name: Restore libv2ray.aar cache
        id: aar
        uses: actions/cache/restore@v4
        with:
          path: aar-cache
          key: libv2ray-aar-v1

      - name: Build libv2ray.aar
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite /tmp/xraylib
          cd /tmp/xraylib
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
          mkdir -p "$GITHUB_WORKSPACE/aar-cache"
          cp libv2ray.aar "$GITHUB_WORKSPACE/aar-cache/"

      - name: Save libv2ray.aar cache
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aar-cache
          key: libv2ray-aar-v1

      - name: Install aar into project
        run: |
          mkdir -p "$PROJECT/app/libs"
          cp aar-cache/libv2ray.aar "$PROJECT/app/libs/"
          ls -la "$PROJECT/app/libs"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # AndroidX لازم است؛ اگر فایل نبود یا ناقص بود، اینجا اضافه می‌شود
      - name: Ensure gradle.properties
        run: |
          touch "$PROJECT/gradle.properties"
          grep -q '^android.useAndroidX' "$PROJECT/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT/gradle.properties"
          grep -q '^org.gradle.jvmargs' "$PROJECT/gradle.properties" || echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> "$PROJECT/gradle.properties"
          cat "$PROJECT/gradle.properties"

      - name: Build APK
        run: |
          set +e
          gradle -p "$PROJECT" :app:assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # خلاصهٔ خطا در بخش Annotations بالای صفحهٔ اجرا نمایش داده می‌شود
            MSG="$(grep -E '^e: |What went wrong|Execution failed|Could not |error:|AAPT|Unresolved|FAILURE' -A3 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle error::${MSG}"
            echo "=========== آخرین خطوط لاگ ==========="
            tail -n 60 build.log
            exit $code
          fi
          tail -n 5 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
